name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
        with:
          version: 11
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - uses: scal-p-labs/scalp-action@7d7d8a3f9e7fd8cfde717731cf7f67883bb7d81f # v0.7.0
        with:
          pm: pnpm
          policy: .scalp/policy.json
          pr-context: ${{ github.event_name == 'pull_request' && 'fork' || 'internal' }}
      - name: Format check
        run: pnpm fmt:check
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm types:check
